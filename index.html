      #lobby {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: #0d1a0d;
        font-family: system-ui, sans-serif;
        z-index: 10;

        position: absolute; inset: 0;
        width: 100%; height: 100%;
        image-rendering: pixelated;
        z-index: 0;
      }

        position: absolute; inset: 0;

        position: relative; z-index: 2;

      #name-input {

        font-size: 18px; text-align: center;

        border-radius: 6px;
      }
      #name-input:focus { outline: none; border-color: #6cbf6c; }
      .btn-row { display: flex; gap: 8px; margin-top: 12px; }
      .btn {
        flex: 1; padding: 10px 14px; font-size: 14px;
        background: #3a6b3a; color: white; border: none;
        border-radius: 6px; cursor: pointer;
        transition: background 0.15s;
      }
      .btn:hover:not(:disabled) { background: #4d8a4d; }
      .btn:disabled { background: #2a3a2a; color: #6a7a6a; cursor: not-allowed; }
      .btn.secondary { background: #2a4a2a; }
      .btn.secondary:hover:not(:disabled) { background: #3a6b3a; }
      #lobby-lang-label {
        font-size: 11px; color: #88a088;
        text-transform: uppercase; letter-spacing: 0.5px;
        margin: 14px 0 6px;

        display: flex; gap: 6px; justify-content: center;
        flex-wrap: wrap; margin-bottom: 6px;
      }

        font-size: 26px; line-height: 1;

        background: rgba(255,255,255,0.04);
